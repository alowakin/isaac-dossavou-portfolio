  <style>
    :root {
      --bg:    #f5f5f4;
      --bg2:   #fafaf9;
      --bg3:   #eeeeec;
      --line:  rgba(0,0,0,.1);
      --accent:#4f8ef7;
      --white: #111111;
      --gray:  #737373;
      --gray2: #d4d4d4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--bg); color: var(--white);
      min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: .012;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 3rem;
      background: rgba(245,245,244,.97);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo {
      font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 800;
      letter-spacing: -.02em; color: var(--white); text-decoration: none;
    }
    .nav-logo em { color: var(--accent); font-style: normal; }
    .nav-back {
      font-size: .78rem; font-weight: 500; letter-spacing: .06em;
      text-transform: uppercase; color: var(--gray);
      text-decoration: none; display: flex; align-items: center; gap: .4rem;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--white); }
    .nav-back svg { width: 14px; height: 14px; fill: currentColor; }

    /* PAGE WRAPPER */
    .page {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 7rem 1.5rem 5rem;
      position: relative; z-index: 1;
    }

    /* PROFILE */
    .profile {
      text-align: center; margin-bottom: 3rem;
      opacity: 0; transform: translateY(24px);
      animation: slideUp .6s .1s ease forwards;
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      border: 3px solid var(--line);
      margin: 0 auto 1.2rem;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name {
      font-family: 'Cal Sans', sans-serif;
      font-size: 1.7rem; font-weight: 600;
      letter-spacing: -.03em; margin-bottom: .3rem;
    }
    .profile-name em { color: var(--accent); font-style: normal; }
    .profile-bio {
      font-size: .85rem; color: var(--gray);
      letter-spacing: .04em;
    }
    .profile-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      margin-top: .8rem;
      font-size: .68rem; font-weight: 600; letter-spacing: .12em;
      text-transform: uppercase; color: var(--accent);
      background: rgba(79,142,247,.1); border: 1px solid rgba(79,142,247,.2);
      padding: .28rem .75rem; border-radius: 100px;
    }
    .profile-badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* TOGGLE BUTTON */
    .toggle-wrap {
      opacity: 0; transform: translateY(20px);
      animation: slideUp .5s .35s ease forwards;
      margin-bottom: 2rem;
    }
    .btn-toggle {
      font-family: 'Instrument Sans', sans-serif;
      font-size: .88rem; font-weight: 700;
      padding: .85rem 2.4rem;
      background: var(--accent); color: #fff;
      border: none; border-radius: 12px;
      cursor: pointer; transition: all .25s;
      display: flex; align-items: center; gap: .6rem;
      letter-spacing: .02em;
      box-shadow: 0 4px 20px rgba(79,142,247,.3);
    }
    .btn-toggle:hover { background: #3778e5; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(79,142,247,.4); }
    .btn-toggle svg { width: 18px; height: 18px; fill: currentColor; transition: transform .3s; }
    .btn-toggle.open svg { transform: rotate(180deg); }

    /* LINKS CONTAINER */
    .links-container {
      width: 100%; max-width: 460px;
      display: flex; flex-direction: column; gap: .75rem;
      overflow: hidden;
    }

    /* Individual link cards */
    .link-card {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.4rem;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 14px;
      text-decoration: none; color: var(--white);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
      opacity: 0; transform: translateY(18px);
      position: relative; overflow: hidden;
    }
    .link-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      border-radius: 4px 0 0 4px;
      background: var(--card-color, var(--accent));
      opacity: 0; transition: opacity .2s;
    }
    .link-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); border-color: var(--card-color, var(--accent)); }
    .link-card:hover::before { opacity: 1; }
    .link-card:hover .card-icon { background: var(--card-color, var(--accent)); }
    .link-card:hover .card-icon svg { fill: #fff; }
    .link-card:hover .card-arrow { border-color: var(--card-color, var(--accent)); background: var(--card-color, var(--accent)); }
    .link-card:hover .card-arrow svg { fill: #fff; }

    .card-icon {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .card-icon svg { width: 22px; height: 22px; fill: var(--card-color, var(--gray)); transition: fill .2s; }
    .card-info { flex: 1; }
    .card-name { font-size: .92rem; font-weight: 600; margin-bottom: .1rem; }
    .card-handle { font-size: .75rem; color: var(--gray); }
    .card-arrow {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--gray2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .2s;
    }
    .card-arrow svg { width: 14px; height: 14px; fill: var(--gray); transition: fill .2s; }

    /* FEATURED TEST CARD */
    .link-card.featured {
      background: linear-gradient(135deg, rgba(79,142,247,.08), rgba(79,142,247,.02));
      border-color: rgba(79,142,247,.25);
      padding: 1.3rem 1.4rem;
    }
    .link-card.featured:hover { background: linear-gradient(135deg, rgba(79,142,247,.14), rgba(79,142,247,.04)); }
    .featured-label {
      position: absolute; top: .7rem; right: .9rem;
      font-size: .58rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; background: var(--accent); color: #fff;
      padding: .15rem .5rem; border-radius: 4px;
    }
    .card-name.big {
      font-family: 'Fraunces', serif;
      font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em;
    }

    /* SEPARATOR */
    .separator {
      opacity: 0; transform: translateY(18px);
      display: flex; align-items: center; gap: .8rem;
      width: 100%; max-width: 460px;
    }
    .sep-line { flex: 1; height: 1px; background: var(--line); }
    .sep-label { font-size: .65rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gray2); }

    /* ANIMATION */
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .link-card.show, .separator.show {
      animation: slideUp .45s ease forwards;
    }

    /* FOOTER */
    .dig-footer {
      margin-top: 3rem; text-align: center;
      opacity: 0; animation: slideUp .5s 1.6s ease forwards;
    }
    .dig-footer p { font-size: .75rem; color: var(--gray2); }
    .dig-footer a { color: var(--gray); text-decoration: none; transition: color .2s; }
    .dig-footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      .page { padding: 6rem 1rem 4rem; }
    }
  </style>

  <script>
    const cards  = ['c2','c3','c4','c5','sep1','c6'];
    let isOpen   = false;
    let animated = false;

    function toggleLinks() {
      const btn = document.getElementById('toggleBtn');

      if (!isOpen) {
        // OPEN — animate cards in sequence
        isOpen = true;
        btn.classList.add('open');
        btn.querySelector('svg').style.transform = 'rotate(180deg)';
        btn.childNodes[2].textContent = ' Fermer';

        if (!animated) {
          animated = true;
          cards.forEach((id, i) => {
            const el = document.getElementById(id);
            el.style.animationDelay = `${i * 90}ms`;
            el.classList.add('show');
          });
        } else {
          // Already animated — just show
          cards.forEach(id => {
            const el = document.getElementById(id);
            el.style.opacity   = '1';
            el.style.transform = 'translateY(0)';
          });
        }
      } else {
        // CLOSE
        isOpen = false;
        btn.classList.remove('open');
        btn.querySelector('svg').style.transform = 'rotate(0deg)';
        btn.childNodes[2].textContent = ' Découvrir';

        [...cards].reverse().forEach((id, i) => {
          const el = document.getElementById(id);
          el.style.transition = `opacity .25s ${i * 50}ms, transform .25s ${i * 50}ms`;
          el.style.opacity    = '0';
          el.style.transform  = 'translateY(12px)';
        });
        // Reset transitions after close
        setTimeout(() => {
          cards.forEach(id => {
            document.getElementById(id).style.transition = '';
          });
        }, 600);
      }
    }
  </script>
